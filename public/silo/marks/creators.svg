<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400" role="img" aria-label="Abstract grainy mark for Tools for Creators">
<filter id="fx03" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="37" result="warp"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="warp" scale="14" xChannelSelector="R" yChannelSelector="G" result="d"></feDisplacementMap>
<feGaussianBlur in="d" stdDeviation="2" result="b"></feGaussianBlur>
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="1" seed="7" result="n"></feTurbulence>
<feComposite in="b" in2="n" operator="arithmetic" k1="0" k2="1" k3="0.55" k4="-0.3" result="mix"></feComposite>
<feComponentTransfer in="mix" result="th"><feFuncA type="discrete" tableValues="0 0 1 1"></feFuncA></feComponentTransfer>
<feFlood flood-color="#1A1714" result="ink"></feFlood>
<feComposite in="ink" in2="th" operator="in"></feComposite>
</filter>
<g filter="url(#fx03)"><circle cx="122" cy="200" r="88" fill="#000"></circle><circle cx="278" cy="200" r="88" fill="#000"></circle><rect x="122" y="186" width="156" height="28" fill="#000"></rect></g>
</svg>